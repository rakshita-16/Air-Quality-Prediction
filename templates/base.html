<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Air Quality Predictor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- ── Navbar ── -->
  <nav class="navbar">
    <div class="nav-brand">
      <i class="fas fa-wind"></i>
      <span>AirQuality<strong>AI</strong></span>
    </div>
    <ul class="nav-links">
      <li><a href="{{ url_for('index') }}"     class="{% if request.endpoint=='index'     %}active{% endif %}"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="{{ url_for('dashboard') }}" class="{% if request.endpoint=='dashboard' %}active{% endif %}"><i class="fas fa-chart-bar"></i> Dashboard</a></li>
      <li><a href="{{ url_for('about') }}"     class="{% if request.endpoint=='about'     %}active{% endif %}"><i class="fas fa-info-circle"></i> About</a></li>
    </ul>
  </nav>

  <!-- ── Page content ── -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ── -->
  <footer class="footer">
    <p>Air Quality Prediction &copy; 2026 &nbsp;|&nbsp; Built with Machine Learning &amp; Flask</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
